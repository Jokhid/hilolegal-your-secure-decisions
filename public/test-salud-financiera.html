<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Termómetro Financiero 360º</title>
    <meta
      name="description"
      content="Test de salud financiera 360º de José Carlos Hidalgo para revisar protección, crecimiento, legalidad y deuda."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap"
    />
    <link rel="stylesheet" href="/financial-health-tool.css" />
    <style>
      :root {
        --brand-navy: #0f2a3b;
        --brand-orange: #f3a11a;
        --brand-cream: #f5f1e9;
        --brand-steel: #1e3c54;
        --brand-teal: #009e60;
      }

      * { box-sizing: border-box; }
      html { scroll-behavior: smooth; background: var(--brand-cream); }
      body {
        margin: 0;
        min-height: 100vh;
        background: var(--brand-cream);
        color: var(--brand-navy);
        font-family: Inter, "Segoe UI", sans-serif;
        -webkit-font-smoothing: antialiased;
      }

      .tool-page__header,
      .tool-page__footer {
        max-width: 1500px;
        margin: 0 auto;
        padding: 1rem clamp(1.25rem, 3vw, 2.75rem);
      }

      .tool-page__header {
        min-height: 76px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        border-bottom: 1px solid rgba(30, 60, 84, .08);
      }

      .tool-page__brand {
        display: inline-flex;
        align-items: center;
        gap: .8rem;
        color: var(--brand-navy);
        text-decoration: none;
        font-size: .78rem;
        font-weight: 900;
        letter-spacing: .18em;
        text-transform: uppercase;
      }

      .tool-page__brand img {
        width: 2.35rem;
        height: 2.35rem;
        object-fit: contain;
        filter: invert(13%) sepia(24%) saturate(1524%) hue-rotate(163deg) brightness(92%) contrast(91%);
      }

      .tool-page__back {
        color: rgba(30, 60, 84, .65);
        font-size: .72rem;
        font-weight: 900;
        letter-spacing: .14em;
        text-transform: uppercase;
        text-decoration: none;
        transition: color 250ms ease;
      }

      .tool-page__back:hover { color: var(--brand-orange); }

      #herramientas {
        max-width: 1500px;
        margin: 0 auto;
        padding: 0 clamp(1.25rem, 3vw, 2.75rem) clamp(5rem, 8vw, 8rem);
      }

      .financial-tool { margin-top: 0; }

      .tool-page__footer {
        border-top: 1px solid rgba(30, 60, 84, .08);
        color: rgba(30, 60, 84, .6);
        font-size: .68rem;
        font-weight: 800;
        letter-spacing: .14em;
        text-align: center;
        text-transform: uppercase;
      }

      @media (max-width: 680px) {
        .tool-page__header { align-items: flex-start; flex-direction: column; gap: 1rem; }
      }
    </style>
  </head>
  <body>
    <header class="tool-page__header">
      <a class="tool-page__brand" href="/">
        <img src="/hilolegal-logo-mark.svg" alt="HiloLegal" />
        <span>José Carlos Hidalgo</span>
      </a>
      <a class="tool-page__back" href="/">Volver a HiloLegal</a>
    </header>

    <main>
      <section id="herramientas" aria-label="Termómetro Financiero 360º">
        <div class="tools__inner"></div>
      </section>
    </main>

    <footer class="tool-page__footer">
      © José Carlos Hidalgo · Termómetro Financiero 360º
    </footer>

    <script src="/financial-health-tool.js" defer></script>
  </body>
</html>
